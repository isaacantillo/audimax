services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: audimax
      POSTGRES_USER: audimax
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-audimax}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audimax -d audimax"]
      interval: 5s
      retries: 10

  app:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://audimax:${POSTGRES_PASSWORD:-audimax}@db:5432/audimax
    depends_on:
      db: { condition: service_healthy }
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      retries: 5

volumes:
  pgdata:
