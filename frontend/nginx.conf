# Serves the built SPA and forwards /api (WebSockets included) to the backend, so the browser sees
# one origin and the session cookie just works. HTTPS is not done here: in production Dokploy's
# Traefik terminates it and forwards plain HTTP to this container.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Keep the scheme Traefik saw (https), so the backend knows the request was secure.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Lecture recordings are large and arrive slowly from a phone; stream them straight through.
        client_max_body_size 2g;
        proxy_request_buffering off;
        # A live-subtitle session stays open for the whole lecture.
        proxy_read_timeout 4h;
        proxy_send_timeout 4h;
    }

    # Vite names built files by content hash: cache those forever. A missing one is a plain 404,
    # never the SPA page (add_header skips error responses).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else is revalidated (index.html names the current hashes, or a deploy leaves
    # browsers on a deleted bundle), and client-side routes (/lectures/…) survive a refresh.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
