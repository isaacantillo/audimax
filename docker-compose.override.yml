# Dev-only; Compose merges this automatically. Production: `docker compose -f docker-compose.yml up -d`.
services:
  app:
    volumes:
      - ./backend/app:/code/app
    environment:
      FASTAPI_ENV: development
    command: ["fastapi", "dev", "app/main.py", "--host", "0.0.0.0", "--port", "8000"]
  db:
    ports:
      - "5432:5432"
